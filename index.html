
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Rock,paper,scissors</title>
</head>
<body>

  <div>
    <button id="roundsButton">ROUNDS</button>
  </div>

  <button id="rock">Rock</button>
  <button id="paper">Paper</button>
  <button id="scissors">scissors</button>

  <div id="computerSelection">Computer:</div>
  <div id="compScore">Score:0</div>

  <div id="humanSelection">Payer:</div>
  <div id="playerScore">Score:0</div>

  <p id="results">results</p>

  <button id="restartButton">RESTART</button>

  <script>

    function getComputerChoice() {
        let number = Math.random();

        if (number < 1/3) {
            return "rock";
        } else if (number < 2/3) {
            return "paper";
        } else {
            return "scissors";
        }
    }

    let humanScore = 0;
    let computerScore = 0;
    let round = 0;
    let totalRounds;

    let rockbtn = document.querySelector("#rock");
    let paperbtn = document.querySelector("#paper");
    let scissorsbtn = document.querySelector("#scissors");
      let computerSelectionDisplay =
            document.querySelector("#computerSelection");
    
    function playRound(playerSelection) {

        if (round === totalRounds) {
            return;
        }

        round = round + 1;

        const ComputerChoice = getComputerChoice();

        computerSelectionDisplay.textContent =
            ("computer:" + ComputerChoice);

        if (
          (playerSelection === "paper" && ComputerChoice === "rock") ||
          (playerSelection === "rock" && ComputerChoice === "scissors") ||
          (playerSelection === "scissors" && ComputerChoice === "paper")
        ) {
            humanScore = humanScore + 1;

        } else if (playerSelection === ComputerChoice) {

        } else {
            computerScore = computerScore + 1;
        }

        let compScore = document.querySelector("#compScore");
        let playerScore = document.querySelector("#playerScore");

        compScore.textContent = ("score:" + computerScore);
        playerScore.textContent = ("score:" + humanScore);

        let results = document.querySelector("#results");

        results.textContent = ("results:");

        if (round === totalRounds) {

            if (computerScore > humanScore) {
                results.textContent += "computer wins,try again";

            } else if (computerScore < humanScore) {
                results.textContent += "you win.congratulations";

            } else {
                results.textContent += "it is atie";
            }
        }
    }

    let humanSelectionDisplay =
        document.querySelector("#humanSelection");

    rockbtn.addEventListener("click", () => {

        humanSelectionDisplay.textContent = ("player:" + "rock");

        playRound("rock")
    });

    paperbtn.addEventListener("click", () => {

        humanSelectionDisplay.textContent = ("player:" + "paper");

        playRound("paper")
    });

    scissorsbtn.addEventListener("click", () => {

        humanSelectionDisplay.textContent = ("player:" + "scissors");

        playRound("scissors")
    });

    let roundsButton =
        document.querySelector("#roundsButton");

    let buttonInput;

    roundsButton.addEventListener("click", () => {

        buttonInput = document.createElement("input");

        buttonInput.type = "number";

        document.body.appendChild(buttonInput);

        buttonInput.addEventListener("change", () => {

            totalRounds = Number(buttonInput.value);

        });
    });

    let restartButton =
        document.querySelector("#restartButton");

    restartButton.addEventListener("click", () => {

        humanScore = 0;

        computerScore = 0;

        round = 0;

        totalRounds = undefined;

        if (buttonInput) {
            buttonInput.remove();
        }

        humanSelectionDisplay.textContent = ("Player:");

        playerScore.textContent = ("score:0");

        compScore.textContent = ("Score:0");

        computerSelectionDisplay.textContent = ("Computer:");

        results.textContent = ("results:");

    });
   playRound(playerSelection);
  </script>

</body>
</html>
